
name: Functional Testing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest --cov=target --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --silent --show-error \
            -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke-test:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for expected commit deployment
        env:
          LIVE_APP_URL: ${{ vars.LIVE_APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            ACTUAL_SHA=$(curl -fsS "$LIVE_APP_URL/health" |
              python -c "import json,sys; print(json.load(sys.stdin).get('commit_sha',''))" || true)

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              echo "Deployment verified: $ACTUAL_SHA"
              break
            fi

            echo "Waiting for deployment... ($i/60)"
            sleep 10
          done

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Smoke test homepage
        run: |
          curl --fail --silent --show-error "$LIVE_APP_URL/" > /dev/null
        env:
          LIVE_APP_URL: ${{ vars.LIVE_APP_URL }}

      - name: Smoke test health endpoint
        run: |
          curl --fail --silent --show-error "$LIVE_APP_URL/health"
        env:
          LIVE_APP_URL: ${{ vars.LIVE_APP_URL }}

      - name: Smoke test function execution
        run: |
          curl --fail --silent --show-error \
            -X POST "$LIVE_APP_URL/" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "function=is_adult" \
            --data-urlencode "args=[18]" | grep -q "True"
        env:
          LIVE_APP_URL: ${{ vars.LIVE_APP_URL }}
